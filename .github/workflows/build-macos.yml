name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks
          test "$(uname -m)" = arm64
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 27

      - name: Build Release app
        run: |
          set -o pipefail
          mkdir -p Build
          # Keep the non-managed XPC configuration and disable upstream Sparkle updates.
          xcodebuild \
            -project VirtualBuddy.xcodeproj \
            -scheme VirtualBuddy \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath Build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            VB_BUNDLE_ID_PREFIX=com.aiello. \
            'OTHER_SWIFT_FLAGS=-D BUILDING_NON_MANAGED_RELEASE -D ALLOW_NON_MANAGED_RELEASE' \
            build 2>&1 | tee Build/build.log

      - name: Verify app and create DMG
        id: package
        run: |
          app=Build/DerivedData/Build/Products/Release/VirtualBuddy.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" > Build/entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.virtualization' Build/entitlements.plist)" = true
          "$app/Contents/MacOS/vctool" --help

          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          name="VirtualBuddy-${version}-arm64-${GITHUB_SHA:0:7}"
          mkdir -p Build/dmg-root Build/dist
          ditto "$app" Build/dmg-root/VirtualBuddy.app
          ln -s /Applications Build/dmg-root/Applications
          hdiutil create -volname VirtualBuddy -srcfolder Build/dmg-root \
            -format UDZO -ov "Build/dist/$name.dmg"
          hdiutil verify "Build/dist/$name.dmg"
          (
            cd Build/dist
            shasum -a 256 "$name.dmg" > "$name.dmg.sha256"
          )
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### $name"
            echo "Source commit: $GITHUB_SHA"
            echo
            echo 'Download the DMG from the artifact below, open it, and drag VirtualBuddy to Applications.'
            echo 'This is an ad-hoc signed, unnotarized ARM64 build. macOS may require Open Anyway in Privacy & Security.'
            echo 'Upstream automatic updates are disabled. Bridged networking requires a managed signing profile and is unavailable in this build.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: Build/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ github.run_id }}
          path: Build/build.log
          retention-days: 3
